name: Temporary authorization redirect probe
on:
  push:
    branches:
      - security/auth-redirect-header-probe
permissions: {}
jobs:
  auth-redirect-probe:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Reproduce cross-host Authorization forwarding using local servers only
        shell: bash
        run: |
          cat > /tmp/auth_redirect_probe.py <<'PY'
          import os
          import threading
          from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

          os.environ['NO_PROXY'] = '*'
          os.environ['no_proxy'] = '*'

          received = []
          class Handler(BaseHTTPRequestHandler):
              def do_GET(self):
                  if self.path == '/redirect':
                      self.send_response(302)
                      self.send_header('Location', f'http://127.0.0.2:{self.server.server_port}/collect')
                      self.send_header('Content-Length', '0')
                      self.end_headers()
                      return
                  if self.path == '/collect':
                      received.append(self.headers.get('Authorization'))
                      self.send_response(200)
                      self.send_header('Content-Length', '2')
                      self.end_headers()
                      self.wfile.write(b'ok')
                      return
                  self.send_error(404)
              def log_message(self, *_):
                  pass

          server = ThreadingHTTPServer(('0.0.0.0', 0), Handler)
          thread = threading.Thread(target=server.serve_forever, daemon=True)
          thread.start()
          try:
              from yt_dlp import YoutubeDL
              with YoutubeDL({'quiet': True, 'no_warnings': True}) as ydl:
                  handlers = ydl._request_director.handlers
                  urllib_keys = [key for key, value in handlers.items()
                                 if 'urllib' in value.RH_NAME.lower()]
                  if not urllib_keys:
                      raise RuntimeError(f'Urllib handler unavailable; handlers={list(handlers)}')
                  ydl._request_director.handlers = {key: handlers[key] for key in urllib_keys}
                  response = ydl.urlopen(
                      f'http://user:pass@127.0.0.1:{server.server_port}/redirect')
                  response.read()
                  response.close()
              print(f'Authorization received by redirected host: {received!r}')
              expected = 'Basic dXNlcjpwYXNz'
              if received != [expected]:
                  raise SystemExit('NOT REPRODUCED: redirected host did not receive the Basic Authorization header')
              print('CONFIRMED: cross-host redirect received the original Basic Authorization header')
          finally:
              server.shutdown()
              server.server_close()
          PY
          PYTHONPATH="$GITHUB_WORKSPACE" python /tmp/auth_redirect_probe.py
